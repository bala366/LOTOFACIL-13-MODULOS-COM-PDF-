name: COMPILAR APK LOTOFACIL 13 MODULOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Gradle
        id: projeto
        shell: bash
        run: |
          SETTINGS="$(find . -maxdepth 4 -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar estrutura
        working-directory: ${{ steps.projeto.outputs.dir }}
        shell: bash
        run: |
          echo "RAIZ DO PROJETO:"
          pwd
          echo ""
          echo "ARQUIVOS:"
          ls -la
          echo ""
          echo "PASTA APP:"
          ls -la app

      - name: Compilar APK
        working-directory: ${{ steps.projeto.outputs.dir }}
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Localizar APK
        id: apk
        working-directory: ${{ steps.projeto.outputs.dir }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK GERADO:"
          echo "$APK"
          echo "arquivo=$APK" >> "$GITHUB_OUTPUT"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: LOTOFACIL-13-MODULOS-APK
          path: ${{ steps.projeto.outputs.dir }}/${{ steps.apk.outputs.arquivo }}
          if-no-files-found: error
          retention-days: 30
